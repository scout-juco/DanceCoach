<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dance Coach Specs Preview</title>
<style>
  :root { --bg:#1B1B1A; --panel:rgba(24,24,23,.92); --ink:#ECECE8; --muted:#A3A29C; --line:#3A3A37; --hot:#7C97FF }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px system-ui, -apple-system, sans-serif; overflow:hidden }
  canvas { display:block; touch-action:none }
  #ui { position:fixed; left:16px; top:16px; width:min(360px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; box-sizing:border-box;
        background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; z-index:2 }
  h1 { margin:0; font-size:16px; font-weight:600 }
  h2 { margin:0; font:600 11px ui-monospace, monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--muted) }
  p { margin:0; color:var(--muted); font-size:12px; line-height:1.5 }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center }
  button { font:600 13px system-ui, sans-serif; min-height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer }
  .row.screens button { font-size:12px; min-height:32px; padding:0 10px }
  button[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink) }
  button.primary { background:var(--hot); border-color:var(--hot); color:#0E1330; width:100% }
  button:focus-visible { outline:2px solid var(--hot); outline-offset:2px }
  label.sl { display:grid; grid-template-columns:78px 1fr 52px; gap:8px; align-items:center; font-size:12px; color:var(--muted) }
  label.sl output { font:12px ui-monospace, monospace; color:var(--ink); text-align:right }
  input[type=range] { width:100% }
  #hide { position:fixed; right:16px; top:16px; z-index:2; background:var(--panel) }
  #ui[hidden] { display:none }
</style>
</head>
<body>
<button id="hide" type="button">Hide panel</button>
<div id="ui">
  <h1>Dance Coach · Specs preview</h1>
  <p id="xrmsg">Checking for WebXR…</p>
  <button id="enter" class="primary" type="button" hidden>View in my room</button>
  <h2>Playthrough</h2>
  <div class="row screens" role="group" aria-label="Playthrough screens" data-group="0"></div>
  <h2>Pose</h2>
  <div class="row screens" role="group" aria-label="Pose screens" data-group="1"></div>
  <h2>Lookback</h2>
  <div class="row screens" role="group" aria-label="Lookback screens" data-group="2"></div>
  <div class="row" role="group" aria-label="Theme">
    <button type="button" data-theme="light">Wireframe light</button>
    <button type="button" data-theme="dark">Specs dark</button>
  </div>
  <label class="sl">Distance <input id="dist" type="range" min="0.6" max="3" step="0.05"><output id="distv"></output></label>
  <label class="sl">To the right <input id="yaw" type="range" min="-60" max="60" step="1"><output id="yawv"></output></label>
  <label class="sl">Below eyes <input id="drop" type="range" min="-0.5" max="0.8" step="0.01"><output id="dropv"></output></label>
  <label class="sl">Size <input id="scale" type="range" min="0.5" max="3" step="0.05"><output id="scalev"></output></label>
  <p>Drag to look around. Everything on the panels works like the prototype: the mode button cycles Playthrough → Pose → Lookback. In the headset, pinch to press, and use the small tweak bar below-left to adjust.</p>
  <button id="reset" type="button">Reset layout</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------
   LAYOUT — edit here to change the design.
   Each screen lists its panels as [x, y, width, height, (z)] in wireframe
   pixels, taken from the 1280×800 "Spectacles view" frames in the
   clickable prototype. A width of null means "as wide as its buttons".
   z (optional, meters) lifts a panel toward you, e.g. a dialog.
   SIZE turns pixels into meters: 1.5 means 1 px = 1.5 mm in your room.
------------------------------------------------------------------- */
const SCREENS = {
  B: { group: 0, label: 'B Playing',     panels: { video: [790, 40, 340, 604], progress: [790, 662, 340, 6] } },
  C: { group: 0, label: 'C Clip ended',  panels: { video: [790, 40, 300, 533], sections: [600, 589, 490, 40], controls: [410, 645, null, 84] } },
  D: { group: 1, label: 'D Pose',        panels: { video: [790, 40, 340, 604], poseThin: [790, 660, 340, 28] } },
  E: { group: 1, label: 'E Pose open',   panels: { video: [790, 40, 300, 533], posePanel: [520, 590, 740, 128] } },
  I: { group: 2, label: 'I Lookback',    panels: { lookPanel: [470, 40, 300, 533], video: [790, 40, 300, 533], attempts: [470, 583, 620, 52], lookControls: [470, 645, null, 84] } },
  J: { group: 2, label: 'J Record?',     panels: { ghostL: [470, 40, 300, 533], ghostV: [790, 40, 300, 533], dialog: [520, 130, 440, 330, 0.03] } },
  K: { group: 2, label: 'K Recording',   panels: { countdown: [560, 200, 200, 200], video: [790, 40, 340, 604], progress: [790, 662, 340, 6] } },
  L: { group: 2, label: 'L Takes',       panels: { lookPanel: [470, 40, 300, 533], video: [790, 40, 300, 533], attempts: [470, 583, 620, 52], lookControls: [470, 645, null, 84] } },
  M: { group: 2, label: 'M Side by side', panels: { sbsL: [500, 40, 310, 555], sbsR: [830, 40, 310, 555], sbsBar: [500, 606, 640, 44], sbsControls: [380, 676, null, 80] } },
};
// Buttons in each control bar, left to right.
const BARS = {
  controls:     ['mode', 'replay', 'top', 'speed', 'mirror', 'counts'],
  lookControls: ['mode', 'speed', 'mirror', 'counts'],
  sbsControls:  ['mode', 'speedCycle', 'mirror', 'counts', ['Record again', 'record'], ['Back to takes', 'takes']],
};
const ORDER = Object.keys(SCREENS);
const ANCHOR = { x: 940, y: 306 };          // this wireframe point sits at the placement point
const DEFAULTS = { dist: 1.5, yaw: 25, drop: 0.10, scale: 1.5, theme: 'light', screen: 'C' };
const BPM = 100;                               // tempo used to animate counts
const MODES = ['Playthrough', 'Pose', 'Lookback'];
const MODE_ENTRY = ['C', 'D', 'I'];            // where the mode button takes you

const THEMES = {
  light: { panel:'#FFFFFF', video:'#D6D6D2', ink:'#1F1F1E', ink2:'#3D3D3A', stroke:'#2B2B2A', muted:'#5E5E5A', soft:'#9A9A96',
           chip:'#FFFFFF', countBg:'rgba(255,255,255,0.88)', active:'#1F1F1E', activeInk:'#FFFFFF', on:'#E3E3DF', done:'#F4F4F1',
           track:'#D6D6D2', take:'#B9B9B4', ghost:'#F4F4F1', ghostLine:'#B9B9B4', you:'#1F1F1E' },
  dark:  { panel:'#121212', video:'#262626', ink:'#F2F2EE', ink2:'#D0D0CA', stroke:'#8E8E89', muted:'#B9B9B3', soft:'#5E5E5A',
           chip:'#121212', countBg:'rgba(0,0,0,0.72)', active:'#F2F2EE', activeInk:'#111111', on:'#34342F', done:'#1A1A1A',
           track:'#2E2E2E', take:'#3A3A36', ghost:'#161616', ghostLine:'#3A3A36', you:'#F2F2EE' },
};

/* ------------------------------ state ------------------------------ */
const S = { ...DEFAULTS, speed: 0.75, mirror: true, counts: true, section: 2, count: 1, pose: 9,
            takes: [], sel: -1, kPhase: 'count', kCount: 3, sbsPlaying: false };
try { Object.assign(S, JSON.parse(localStorage.getItem('dc-specs-preview') || '{}')); } catch (e) {}
const q = new URLSearchParams(location.search);
for (const k of ['dist', 'yaw', 'drop', 'scale']) if (q.has(k)) S[k] = parseFloat(q.get(k));
if (q.has('theme')) S.theme = q.get('theme');
const startScreen = SCREENS[q.get('screen')] ? q.get('screen') : DEFAULTS.screen;
function save() { try { localStorage.setItem('dc-specs-preview', JSON.stringify({ dist:S.dist, yaw:S.yaw, drop:S.drop, scale:S.scale, theme:S.theme, speed:S.speed, mirror:S.mirror, counts:S.counts })); } catch (e) {} }
const modeOf = sc => SCREENS[sc].group;
const poseLabel = () => `${Math.floor(S.pose / 2) + 1}${S.pose % 2 ? '&' : ''}`;

/* ------------------------------ three ------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const desktopBg = new THREE.Color('#ECECE8');
scene.background = desktopBg;
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 50);

// A stand-in room for desktop only (the headset shows your real room).
const room = new THREE.Group();
const grid = new THREE.GridHelper(12, 24, 0xB9B9B4, 0xD3D3CE); grid.position.y = -1.6; room.add(grid);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.98, 1.0, 64), new THREE.MeshBasicMaterial({ color: 0x9A9A96, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; ring.scale.set(1, 0.55, 1); ring.position.set(-0.2, -1.59, -1.8); room.add(ring);
scene.add(room);

// rig = where you stood/faced at start; board = the UI plane placed relative to it.
const rig = new THREE.Group(); scene.add(rig);
const yawPivot = new THREE.Group(); rig.add(yawPivot);
const board = new THREE.Group(); yawPivot.add(board);

/* ---------------------------- panels ------------------------------ */
const RES = 3; // canvas pixels per wireframe pixel
const measureCtx = document.createElement('canvas').getContext('2d');
const PANELS = {};
function makePanel(name, draw, clickable = true, parent = board) {
  const c = document.createElement('canvas'); c.width = c.height = RES;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true }));
  const p = { name, w: 1, h: 1, z: 0, canvas: c, ctx: c.getContext('2d'), tex: null, mesh, draw, clickable, hits: [], rect: null };
  mesh.userData.panel = p; mesh.visible = false;
  setTexture(p);
  p.redraw = () => { const ctx = p.ctx; ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.clearRect(0, 0, p.w, p.h); p.hits = []; draw(ctx, p); p.tex.needsUpdate = true; };
  parent.add(mesh);
  PANELS[name] = p;
  return p;
}
function setTexture(p) {
  if (p.tex) p.tex.dispose();
  p.tex = new THREE.CanvasTexture(p.canvas); p.tex.colorSpace = THREE.SRGBColorSpace; p.tex.anisotropy = 8;
  p.mesh.material.map = p.tex; p.mesh.material.needsUpdate = true;
}
function setRect(p, [x, y, w, h, z = 0]) {
  if (w == null) w = barWidth(BARS[p.name], h - 24);
  p.rect = { x, y, w, h }; p.z = z;
  if (p.w !== w || p.h !== h) { p.w = w; p.h = h; p.canvas.width = Math.round(w * RES); p.canvas.height = Math.round(h * RES); setTexture(p); }
}
function layoutPanels() {
  const k = S.scale / 1000;
  for (const p of Object.values(PANELS)) {
    if (!p.rect || p === tweak) continue;
    p.mesh.scale.set(p.rect.w * k, p.rect.h * k, 1);
    p.mesh.position.set((p.rect.x + p.rect.w / 2 - ANCHOR.x) * k, -(p.rect.y + p.rect.h / 2 - ANCHOR.y) * k, p.z);
  }
  board.position.set(0, -S.drop, -S.dist);
  yawPivot.rotation.y = -THREE.MathUtils.degToRad(S.yaw);
}

/* ---------------------------- drawing helpers ----------------------------- */
const T = () => THEMES[S.theme] || THEMES.light;
const SANS = 'system-ui, -apple-system, "Segoe UI", sans-serif', MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
function rr(ctx, x, y, w, h, r, fill, stroke, lw = 1.5, dash) {
  ctx.beginPath(); ctx.roundRect(x + lw / 2, y + lw / 2, w - lw, h - lw, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.setLineDash(dash || []); ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); ctx.setLineDash([]); }
}
function text(ctx, s, x, y, { size = 13, weight = 400, color = T().ink, font = SANS, align = 'left', base = 'middle' } = {}) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function wrap(ctx, s, x, y, maxW, lh, opts = {}) {
  const { size = 11, weight = 400, font = SANS } = opts;
  ctx.font = `${weight} ${size}px ${font}`;
  let line = '', yy = y;
  for (const word of s.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (ctx.measureText(t).width > maxW && line) { text(ctx, line, x, yy, { ...opts, base: 'top' }); line = word; yy += lh; }
    else line = t;
  }
  if (line) text(ctx, line, x, yy, { ...opts, base: 'top' });
}
function chipW(s) { measureCtx.font = `400 11px ${MONO}`; return measureCtx.measureText(s).width + 16; }
function chip(ctx, s, x, y, dark = false) {
  const w = chipW(s);
  rr(ctx, x, y, w, 20, 10, dark ? T().active : T().chip, null);
  text(ctx, s, x + 8, y + 10.5, { size: 11, font: MONO, color: dark ? T().activeInk : T().ink });
  return w;
}
function chipsRight(ctx, list, right, y) { let x = right; for (let i = list.length - 1; i >= 0; i--) { const [s, dark] = list[i]; x -= chipW(s); chip(ctx, s, x, y, dark); x -= 6; } }
function lock(ctx, x, y, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 1.2;
  ctx.strokeRect(x + 2, y + 5, 8, 6);
  ctx.beginPath(); ctx.moveTo(x + 4, y + 5); ctx.lineTo(x + 4, y + 3.5); ctx.arc(x + 6, y + 3.5, 2, Math.PI, 0); ctx.lineTo(x + 8, y + 5); ctx.stroke();
}
function tag(ctx, s, x, yBottom, { locked = false, dark = false } = {}) {
  measureCtx.font = `400 11px ${MONO}`; const tw = measureCtx.measureText(s).width + (locked ? 34 : 20);
  const t = T();
  rr(ctx, x, yBottom - 22, tw, 22, 11, dark ? t.active : t.chip, null);
  if (locked) lock(ctx, x + 8, yBottom - 17, dark ? t.activeInk : t.ink);
  text(ctx, s, x + (locked ? 24 : 10), yBottom - 10.5, { size: 11, font: MONO, color: dark ? t.activeInk : t.ink });
}
function countBadge(ctx, x, y, d, label, size) {
  ctx.beginPath(); ctx.arc(x + d / 2, y + d / 2, d / 2, 0, Math.PI * 2); ctx.fillStyle = T().countBg; ctx.fill();
  text(ctx, label, x + d / 2, y + d / 2 + 2, { size, weight: 600, align: 'center' });
}
// Stick-figure poses, one per count, so the "video" visibly moves.
const POSES = [
  [[22,38],[80,72],[30,150],[72,148]], [[26,80],[74,80],[34,152],[66,152]], [[20,42],[78,30],[28,146],[70,152]], [[22,74],[78,36],[34,152],[68,150]],
  [[30,30],[70,30],[32,150],[68,150]], [[18,55],[82,55],[26,148],[74,148]], [[24,36],[76,78],[36,152],[64,146]], [[26,80],[74,80],[34,152],[66,152]],
];
function figure(ctx, cx, cy, s, count, color = T().muted, wobble = 0) {
  const pose = POSES[(Math.max(1, count) - 1) % 8].map(([a, b], i) => [a + (i < 2 ? wobble * (i ? -1 : 1) : 0), b + (i < 2 ? wobble : 0)]);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(S.mirror ? -s : s, s); ctx.translate(-50, -90);
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(50, 28, 12, 0, Math.PI * 2); ctx.stroke();
  const L = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };
  L(50, 40, 50, 100); L(50, 55, ...pose[0]); L(50, 55, ...pose[1]); L(50, 100, ...pose[2]); L(50, 100, ...pose[3]);
  ctx.restore();
}
function playIcon(ctx, cx, cy, r, color) { ctx.beginPath(); ctx.moveTo(cx - r * 0.45, cy - r * 0.6); ctx.lineTo(cx + r * 0.65, cy); ctx.lineTo(cx - r * 0.45, cy + r * 0.6); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); }
function pauseIcon(ctx, cx, cy, r, color) { ctx.fillStyle = color; ctx.fillRect(cx - r * 0.5, cy - r * 0.55, r * 0.35, r * 1.1); ctx.fillRect(cx + r * 0.15, cy - r * 0.55, r * 0.35, r * 1.1); }

/* ---------------------------- control bars ----------------------------- */
const GAP = 8;
function itemW(it, H) {
  if (Array.isArray(it)) { measureCtx.font = `600 12px ${SANS}`; return Math.ceil(measureCtx.measureText(it[0]).width) + 28; }
  return { mode: 170, replay: 110, top: 150, speed: 132, mirror: H, counts: H, speedCycle: 64, divider: 9 }[it];
}
function barWidth(items, H) { return 24 + items.reduce((s, it) => s + itemW(it, H), 0) + GAP * (items.length - 1); }
function drawItems(ctx, p, items, x, y, H) {
  const t = T();
  for (const it of items) {
    const w = itemW(it, H);
    if (Array.isArray(it)) {
      const [label, id, opts = {}] = it;
      const on = opts.on;
      rr(ctx, x, y, w, H, 12, on ? t.on : t.panel, on ? t.ink : t.soft);
      text(ctx, label, x + w / 2, y + H / 2, { size: 12, weight: 600, align: 'center' });
      p.hits.push({ x, y, w, h: H, id });
    } else if (it === 'divider') {
      ctx.fillStyle = t.track; ctx.fillRect(x + 4, y + (H - 36) / 2, 1, 36);
    } else if (it === 'mode') {
      const m = modeOf(S.screen);
      rr(ctx, x, y, w, H, 12, t.panel, t.ink);
      text(ctx, '↻ ' + MODES[m], x + 12, y + H / 2 - 9, { weight: 600 });
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + 16 + i * 11, y + H / 2 + 11, 3.5, 0, Math.PI * 2); ctx.fillStyle = i === m ? t.ink : t.panel; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = t.ink; ctx.stroke(); }
      text(ctx, 'NEXT: ' + MODES[(m + 1) % 3].toUpperCase(), x + 50, y + H / 2 + 11, { size: 10, font: MONO, color: t.muted });
      p.hits.push({ x, y, w, h: H, id: 'mode' });
    } else if (it === 'replay') {
      rr(ctx, x, y, w, H, 12, t.active, t.active);
      text(ctx, '↺', x + w / 2, y + H / 2 - 8, { size: 18, weight: 600, color: t.activeInk, align: 'center' });
      text(ctx, 'Replay section', x + w / 2, y + H / 2 + 14, { size: 12, weight: 600, color: t.activeInk, align: 'center' });
      p.hits.push({ x, y, w, h: H, id: 'replay' });
    } else if (it === 'top') {
      rr(ctx, x, y, w, H, 12, t.panel, t.soft);
      const my = y + H / 2 - 8;
      ctx.strokeStyle = t.ink; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(x + 53, my - 6); ctx.lineTo(x + 53, my + 6); ctx.moveTo(x + 53, my); ctx.lineTo(x + 92, my); ctx.moveTo(x + 86, my - 5); ctx.lineTo(x + 92, my); ctx.lineTo(x + 86, my + 5); ctx.stroke();
      text(ctx, 'From the top', x + w / 2, y + H / 2 + 14, { size: 12, weight: 600, align: 'center' });
      p.hits.push({ x, y, w, h: H, id: 'top' });
    } else if (it === 'speed') {
      rr(ctx, x, y, w, H, 12, t.panel, t.soft);
      [0.5, 0.75, 1].forEach((s, i) => {
        const bx = x + i * 44, on = S.speed === s;
        if (on) { ctx.save(); ctx.beginPath(); ctx.roundRect(x + 1.5, y + 1.5, w - 3, H - 3, 11); ctx.clip(); ctx.fillStyle = t.active; ctx.fillRect(bx, y, 44, H); ctx.restore(); }
        text(ctx, `${s}×`, bx + 22, y + H / 2, { size: 12, weight: 600, font: MONO, color: on ? t.activeInk : t.ink, align: 'center' });
        p.hits.push({ x: bx, y, w: 44, h: H, id: 'speed:' + s });
      });
    } else if (it === 'speedCycle') {
      rr(ctx, x, y, w, H, 12, t.panel, t.soft);
      text(ctx, `${S.speed}×`, x + w / 2, y + H / 2, { size: 12, weight: 600, font: MONO, align: 'center' });
      p.hits.push({ x, y, w, h: H, id: 'speedCycle' });
    } else if (it === 'mirror' || it === 'counts') {
      const on = S[it];
      rr(ctx, x, y, w, H, 12, on ? t.on : t.panel, on ? t.ink : t.soft);
      text(ctx, it === 'mirror' ? 'Mirror' : 'Counts', x + w / 2, y + H / 2 - 8, { size: 11, weight: 600, align: 'center' });
      text(ctx, on ? 'on' : 'off', x + w / 2, y + H / 2 + 8, { size: 11, weight: 600, align: 'center', color: on ? t.ink : t.muted });
      p.hits.push({ x, y, w, h: H, id: it });
    }
    x += w + GAP;
  }
}
function drawBar(ctx, p) {
  rr(ctx, 0, 0, p.w, p.h, 18, T().panel, T().stroke);
  drawItems(ctx, p, BARS[p.name], 12, 12, p.h - 24);
}

/* ---------------------------- panel drawings ----------------------------- */
function drawVideo(ctx, p) {
  const t = T(), sc = S.screen, { w, h } = p, pose = sc === 'D' || sc === 'E';
  rr(ctx, 0, 0, w, h, 16, t.video, pose ? t.ink : t.stroke, pose ? 2.5 : 1.5);
  figure(ctx, w / 2, h / 2, w > 320 ? 1.2 : 1.1, pose ? Math.floor(S.pose / 2) + 1 : S.count, pose ? t.ink2 : t.muted);
  if (S.counts) pose ? countBadge(ctx, 14, 14, 84, poseLabel(), 40) : countBadge(ctx, 14, 14, 84, String(S.count), 44);
  const chips = [];
  if (sc === 'K' && S.kPhase === 'play') chips.push(['● REC', true]);
  if (sc === 'B' || sc === 'K') chips.push([`${S.speed}×`]);
  if ((sc === 'B' || sc === 'K' || pose) && S.mirror) chips.push(['MIRRORED']);
  chipsRight(ctx, chips, w - 14, 14);
  const sec = `SECTION ${S.section}`;
  const tags = {

/* ------------------------------ actions ------------------------------ */
function act(id, px) {
  const sc = S.screen;
  if (id === 'mode') return go(MODE_ENTRY[(modeOf(sc) + 1) % 3]);
  if (id === 'replay' || id === 'top') return go('B');
  if (id.startsWith('sec:')) { const s = id.slice(4); S.section = s === 'Full' ? 'Full' : Number(s); return go('B'); }
  if (id.startsWith('speed:')) S.speed = parseFloat(id.slice(6));
  else if (id === 'speedCycle') S.speed = { 0.5: 0.75, 0.75: 1, 1: 0.5 }[S.speed];
  else if (id === 'mirror' || id === 'counts') S[id] = !S[id];
  else if (id === 'openPose') return go('E');
  else if (id === 'closePose') return go('D');
  else if (id === 'back1') S.pose = Math.max(0, S.pose - 2);
  else if (id === 'fwd1') S.pose = Math.min(15, S.pose + 2);
  else if (id === 'scrub') S.pose = THREE.MathUtils.clamp(Math.floor(((px - 14) / (PANELS.posePanel.w - 28)) * 16), 0, 15);
  else if (id === 'record') return go('J');
  else if (id === 'yes') return go('K');
  else if (id === 'no') return go(S.takes.length ? 'L' : 'I');
  else if (id === 'sbs') return go('M');
  else if (id.startsWith('take:')) { S.sel = Number(id.slice(5)); return go('L'); }
  else if (id === 'takes') return go('L');
  else if (id === 'sbsPlay') { if (!S.sbsPlaying && S.count >= 8) S.count = 1; S.sbsPlaying = !S.sbsPlaying; beatClock = 0; }
  else if (id === 'sbsScrub') { S.count = THREE.MathUtils.clamp(Math.floor(((px - 56) / (PANELS.sbsBar.w - 56)) * 8) + 1, 1, 8); }
  save(); refresh();
}

function tweakAct(id) {
  const i = ORDER.indexOf(S.screen);
  switch (id) {
    case 'prev': return go(ORDER[(i + ORDER.length - 1) % ORDER.length]);
    case 'next': return go(ORDER[(i + 1) % ORDER.length]);

    case 'recenter': needRecenter = true; break;

    case 'smaller': S.scale = Math.max(0.4, +(S.scale - 0.1).toFixed(2)); break;
    case 'bigger': S.scale = Math.min(4, +(S.scale + 0.1).toFixed(2)); break;

    case 'up': S.drop = +(S.drop - 0.05).toFixed(2); break;

/* ------------------------------ screens ------------------------------ */
let beatClock = 0;
function go(screen) {
  S.screen = screen; beatClock = 0; S.sbsPlaying = false;
  if (screen === 'B') S.count = 1;
  if (screen === 'C' || screen === 'L') S.count = 8;
  if (screen === 'I') S.count = 1;
  if (screen === 'K') { S.kPhase = 'count'; S.kCount = 3; S.count = 1; }
  if (screen === 'L' && S.sel < 0 && S.takes.length) S.sel = S.takes.length - 1;
  if (screen === 'M') { S.count = 1; if (!S.takes.length) { S.takes.push({ speed: S.speed }); S.sel = 0; } if (S.sel < 0) S.sel = S.takes.length - 1; }
  if (screen === 'L' && !S.takes.length) { S.takes.push({ speed: S.speed }); S.sel = 0; }
  refresh();
}
function refresh() {
  const want = SCREENS[S.screen].panels;
  for (const [name, p] of Object.entries(PANELS)) {
    if (p === tweak) continue;
    const r = want[name];
    p.mesh.visible = !!r && !(name === 'countdown' && S.kPhase === 'play');
    if (r) setRect(p, r);
  }
  for (const p of Object.values(PANELS)) if (p.mesh.visible || p === tweak) p.redraw();
  layoutPanels();
  syncUI();
}

/* ------------------------------ input ------------------------------ */
const raycaster = new THREE.Raycaster();
const targets = () => Object.values(PANELS).filter(p => p.clickable && p.mesh.visible).map(p => p.mesh);
function hitTest() {
  const hits = raycaster.intersectObjects(targets(), false);
  for (const hit of hits) {
    if (!hit.uv) continue;
    const p = hit.object.userData.panel, px = hit.uv.x * p.w, py = (1 - hit.uv.y) * p.h;
    const h = p.hits.find(r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h);
    return { hit, p, h, px };
  }
  return null;
}
function press() {
  const r = hitTest();
  if (!r || !r.h) return false;
  r.p === tweak ? tweakAct(r.h.id) : act(r.h.id, r.px);
  return true;
}

// Desktop: drag to look, click to press.
let look = { yaw: THREE.MathUtils.degToRad(-14), pitch: -0.08 }, drag = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
  look.yaw += dx * 0.004; look.pitch = THREE.MathUtils.clamp(look.pitch + dy * 0.004, -1.2, 1.2);
});
el.addEventListener('pointerup', e => {
  if (drag && drag.moved < 6) {
    const ndc = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera); press();
  }
  drag = null;
});

// Headset: pinch (select) from either hand.
const tmp = new THREE.Matrix4();
const cursor = new THREE.Mesh(new THREE.SphereGeometry(0.006, 12, 8), new THREE.MeshBasicMaterial({ color: 0x7C97FF }));
cursor.visible = false; scene.add(cursor);
const ctrls = [0, 1].map(i => {
  const c = renderer.xr.getController(i);
  c.addEventListener('select', () => { rayFrom(c); if (!press() && !tweak.mesh.visible) tweak.mesh.visible = true; });
  scene.add(c); return c;
});
function rayFrom(obj) {
  tmp.identity().extractRotation(obj.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(obj.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmp);
}

/* ------------------------------ XR session ------------------------------ */
const enterBtn = document.getElementById('enter'), xrmsg = document.getElementById('xrmsg');
let needRecenter = false;
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-ar').then(ok => {
    if (ok) { enterBtn.hidden = false; xrmsg.textContent = 'WebXR is available. Tap below, then look to your right.'; }
    else xrmsg.textContent = 'No AR here. Open this page in the Spectacles browser to see it in your room. This desktop view is a stand-in.';
  }).catch(() => { xrmsg.textContent = 'Could not check WebXR. Desktop view only.'; });
} else xrmsg.textContent = 'No WebXR in this browser. Open this page in the Spectacles browser to see it in your room. This desktop view is a stand-in.';

enterBtn.addEventListener('click', async () => {
  try {
    const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor', 'hand-tracking'] });
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    scene.background = null; room.visible = false;
    tweak.mesh.visible = true; needRecenter = true;
    session.addEventListener('end', () => { scene.background = desktopBg; room.visible = true; tweak.mesh.visible = false; rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0); });
  } catch (err) { xrmsg.textContent = 'Could not start AR: ' + err.message; }
});

function recenter() {
  const cam = renderer.xr.getCamera();
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion();
  cam.getWorldPosition(pos); cam.getWorldQuaternion(quat);
  const e = new THREE.Euler().setFromQuaternion(quat, 'YXZ');
  rig.position.copy(pos); rig.rotation.set(0, e.y, 0);
}

document.getElementById('hide').addEventListener('click', e => { ui.hidden = !ui.hidden; e.target.textContent = ui.hidden ? 'Show panel' : 'Hide panel'; });
document.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => { S.theme = b.dataset.theme; save(); refresh(); }));
const fmt = { dist: v => v.toFixed(2) + ' m', yaw: v => v + '°', drop: v => v.toFixed(2) + ' m', scale: v => v.toFixed(2) + '×' };
for (const k of Object.keys(fmt)) {
  const inp = document.getElementById(k);
  inp.addEventListener('input', () => { S[k] = parseFloat(inp.value); save(); layoutPanels(); tweak.redraw(); syncUI(); });
}
document.getElementById('reset').addEventListener('click', () => { Object.assign(S, { dist: DEFAULTS.dist, yaw: DEFAULTS.yaw, drop: DEFAULTS.drop, scale: DEFAULTS.scale }); save(); refresh(); });
function syncUI() {
  for (const k of Object.keys(fmt)) { document.getElementById(k).value = S[k]; document.getElementById(k + 'v').textContent = fmt[k](S[k]); }
  document.querySelectorAll('[data-screen]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.screen === S.screen)));
  document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === S.theme)));
}

/* ------------------------------ loop ------------------------------ */
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
go(startScreen);
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (renderer.xr.isPresenting) {
    if (needRecenter) { recenter(); needRecenter = false; }
    cursor.visible = false;
    for (const c of ctrls) { rayFrom(c); const r = hitTest(); if (r) { cursor.position.copy(r.hit.point); cursor.visible = true; break; } }
  } else {
    camera.rotation.set(look.pitch, look.yaw, 0, 'YXZ');
  }
  const beat = 60 / BPM / S.speed;
  beatClock += dt;
  if (S.screen === 'B' && beatClock >= beat) {
    // Playthrough: counts advance with the beat, then the clip ends (screen C).
    beatClock -= beat;
    if (S.count >= 8) go('C'); else { S.count++; PANELS.video.redraw(); PANELS.progress.redraw(); }
  } else if (S.screen === 'K') {
    // Lookback: 3, 2, 1 beside the video, then the section plays with REC while the phone films.
    if (S.kPhase === 'count' && beatClock >= 1) {
      beatClock -= 1;
      if (S.kCount > 1) { S.kCount--; PANELS.countdown.redraw(); }
      else { S.kPhase = 'play'; refresh(); }
    } else if (S.kPhase === 'play' && beatClock >= beat) {
      beatClock -= beat;
      if (S.count >= 8) { S.takes.push({ speed: S.speed }); S.sel = S.takes.length - 1; go('L'); }
      else { S.count++; PANELS.video.redraw(); PANELS.progress.redraw(); }
    }
  } else if (S.screen === 'M' && S.sbsPlaying && beatClock >= beat) {
    beatClock -= beat;
    if (S.count >= 8) S.sbsPlaying = false; else S.count++;
    PANELS.sbsL.redraw(); PANELS.sbsR.redraw(); PANELS.sbsBar.redraw();
  } else if (!['B', 'K', 'M'].includes(S.screen)) beatClock = 0;
  renderer.render(scene, camera);
});
</script>
</body>
